[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pohang-stage1-multiwindow-ortho-v22"
version = "2.2.0"
description = "Multi-window leakage-safe Stage-1 selection and category-deproxied interaction validation for Pohang Expected Tourism Spend"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "scikit-learn>=1.5",
  "catboost>=1.2.7",
  "matplotlib>=3.9",
  "PyYAML>=6.0",
  "networkx>=3.3",
  "joblib>=1.4",
]

[project.scripts]
pohang-main-v2 = "pohang_main_v2.cli:main"
pohang-stage1-v22 = "pohang_stage1_v22.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
