[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pohang-donor-models"
version = "0.1.0"
description = "Seoul/Gyeonggi donor auxiliary models for the Pohang tourism coupon project"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
  "PyYAML>=6,<7",
  "joblib>=1.3,<2",
  "catboost>=1.2,<2",
  "tabulate>=0.9,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
pohang-donor-models = "pohang_donor_models.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
